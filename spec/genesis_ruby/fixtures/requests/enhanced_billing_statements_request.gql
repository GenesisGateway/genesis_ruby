query {
  enhancedBillingStatements(filter: { startDateFrom: "2024-01-01", startDateTo: "2024-01-05", billingStatement: ["A123","B456"], masterAccountMID: ["111700000000000"], currency: "EUR", status: paid }, sort: { byDirection: desc, byField: creationDate }, paging: { perPage: 100 })
  {
    items
    {
      id
      billingStatement
      status
      company
      masterAccountName
      masterAccountMID
      masterAccountCurrency
      valueDate
      creationDate
      currency
      paymentMethod
      startDate
      endDate
      pricingMethod
      summary
      {
        grossVolume
        {
          count
          amount
        }
        refunds
        {
          count
          amount
        }
        payouts
        {
          count
          amount
        }
        chargebacks
        {
          count
          amount
        }
        totalFees
        {
          count
          amount
        }
        netReserves
        {
          count
          amount
        }
        netSettlementAmount
        paymentAmount
      }
      details
      {
        discountFees
        {
          subtotalCount
          subtotalValue
          subtotalAmount
          feesByRegionAndCardType
          {
            category
            feesByTransactionType
            {
              transactionType
              count
              value
              amount
              rate
              interchange
            }
          }
        }
        transactionFees
        {
          subtotalCount
          subtotalAmount
          transactionFeeItems
          {
            category
            transactions
            rate
            amount
          }
        }
        serviceFees
        {
          subtotalCount
          subtotalAmount
          serviceFeeItems
          {
            category
            count
            amount
            rate
          }
        }
        chargebacks
        {
          subtotalCount
          subtotalAmount
          chargebackItems
          {
            type
            count
            amount
          }
        }
        miscellaneous
        {
          totalBalance
          adjustments
          {
            description
            amount
          }
        }
        reserves
        {
          totalBalance
          reserveItems
          {
            category
            maturityDate
            ratePercentage
            amount
          }
        }
      }
    }
    paging
    {
      count
      perPage
      after
      before
    }
  }
}

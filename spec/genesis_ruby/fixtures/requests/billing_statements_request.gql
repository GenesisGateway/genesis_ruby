query {
  billingStatements(filter: { startDateFrom: "2024-01-01", startDateTo: "2024-01-05", billingStatement: ["A123","B456"], masterAccountMID: ["111700000000000"], currency: "EUR", status: paid }, sort: { byDirection: desc, byField: creationDate }, paging: { perPage: 100 })
  {
    items
    {
      id
      billingStatement
      status
      company
      masterAccountName
      masterAccountMID
      masterAccountCurrency
      valueDate
      creationDate
      currency
      paymentMethod
      startDate
      endDate
      summary
      {
        grossVolume
        debit
        credit
        fees
        taxes
        netReserves
        adjustments
        netSettlementAmount
        paymentFxConversionFee
        paymentAmount
        paymentCurrency
      }
      details
      {
        transactionTypesBreakdown
        {
          category
          transactionType
          count
          amount
        }
      }
    }
    paging
    {
      count
      perPage
      after
      before
    }
  }
}
